[project]
name = "discount-decisioning"
version = "0.1.0"
description = "ML pipeline for e-commerce discount decisioning"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "joblib>=1.4.0",
    "pyarrow>=18.0.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["discount_decisioning*"]

[tool.ruff]
line-length = 100
