apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: discount-training-
  namespace: dev
spec:
  entrypoint: training-pipeline
  serviceAccountName: argo-workflow
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  templates:
    - name: training-pipeline
      steps:
        - - name: generate-data
            template: generate-data
        - - name: train-model
            template: train-model
        - - name: upload-model
            template: upload-model

    - name: generate-data
      container:
        image: discount-decisioning:v1
        command: [python, -m, src.data.generator]
        args: ["--output", "/workdir/sessions.parquet"]
        volumeMounts:
          - name: workdir
            mountPath: /workdir

    - name: train-model
      container:
        image: discount-decisioning:v1
        command: [python, -m, src.training.train]
        args: ["--input", "/workdir/sessions.parquet", "--output", "/workdir/model.joblib"]
        volumeMounts:
          - name: workdir
            mountPath: /workdir

    - name: upload-model
      container:
        image: amazon/aws-cli:2.27.28
        command: [sh, -c]
        args:
          - |
            aws s3 cp /workdir/model.joblib s3://models/discount-decisioning/v2/model.joblib \
              --endpoint-url http://seaweedfs-s3.seaweedfs-system.svc:8333
        env:
          - name: AWS_ACCESS_KEY_ID
            value: admin-key
          - name: AWS_SECRET_ACCESS_KEY
            value: admin-secret
        volumeMounts:
          - name: workdir
            mountPath: /workdir
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
